<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal - J-Dan Pharmacy</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; border-top: 5px solid #28a745; }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #666; margin-bottom: 25px; font-size: 14px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-weight: bold; font-size: 14px; color: #333; display: block; margin-bottom: 5px; text-align: center;}
        input[type="password"] { width: 100%; padding: 15px; border: 2px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 28px; text-align: center; letter-spacing: 10px; background: #fafafa;}
        input[type="password"]:focus { outline: none; border-color: #28a745; }
        .btn-login { width: 100%; background: #28a745; color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .btn-login:hover { background: #218838; }
        .error { color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Staff Portal</h2>
        <p>Happy Med Pharmacy - Malate Manila Branch</p>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                 <label>Enter your 6-Digit PIN Password:</label>
                <input type="password" name="pin" pattern="\d{6}" maxlength="6" placeholder="******" required autofocus autocomplete="off">
            </div>
            <button type="submit" class="btn-login">Log In to My Dashboard</button>
        </form>
    </div>
</body>
</html>
